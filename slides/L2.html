<ul>

<h1 id="a-rails-decoupling-ground--b2">(a) Rails, decoupling, ground — B2</h1>
<ul>
<li>5 V in (USB-C <strong>or</strong> jack, SS34 ORing) → <strong>+5V_RAW</strong> → AMS1117 → <strong>+3V3</strong></li>
<li>2 × B0512S-2WR3 isolated modules → <strong>+12 V / AGND / −12 V</strong> → 78L05 → <strong>+5VA</strong></li>
<li><strong>Rule:</strong> anything not voltage-sensitive runs from raw 5 V. ±12 V and +5VA feed only op-amps, ADC, DAC.</li>
<li><strong>100 nF at every supply pin, 10 µF per rail per zone.</strong> Distance beats value.</li>
<li><strong>Two grounds, one star point.</strong> GND (power, logic; layer 2 plane) and AGND (signals) meet once, at the B1/base boundary.</li>
</ul>
<footer>Basic Skills for Experimentalists · TIGP 2026 · Lecture 2 — Electronics 101</footer>
</section>

<h1 id="b-what-%C2%B110-v-and-16-bits-buy--b1--b3">(b) What ±10 V and 16 bits buy — B1 / B3</h1>
<ul>
<li>20 V / 65,536 = <strong>0.3 mV per LSB</strong></li>
<li>Every other choice on the board exists to keep noise below that: the star point, AGND copper under the ADC, no digital under the inputs, SPI entering from one side.</li>
<li>Input network <strong>1 kΩ → 1 nF → BAV99 to ±12 V</strong>: current limit, gentle low-pass (≈ 160 kHz), clamp. A 30 V accident flows into the rail, not the chip.</li>
<li><strong>Sampling:</strong> 500 kSPS aggregate; anything above half the sample rate aliases. The Scope tab: rolling tens of kS/s (WiFi-limited), burst up to the ADC.</li>
</ul>

<h1 id="d-isolation--b4">(d) Isolation — B4</h1>
<ul>
<li>A <strong>relay</strong>: coil and contacts share no copper. ULN2003 drives four coils from GPIO; its COM pin carries the flyback diodes that eat the coil's kick.</li>
<li>An <strong>optocoupler</strong> (6N137): LED and transistor share no copper; 5–24 V in, 3.3 V out, fast.</li>
<li><strong>Creepage</strong>: the distance that keeps it so — <strong>2.5 mm band</strong>, no copper of any other net under it, on any layer. DRC checks it; your reviewer checks it.</li>
<li>Contacts: <strong>≤ 30 V DC, 1 A. Never mains.</strong></li>
</ul>
<footer>Basic Skills for Experimentalists · TIGP 2026 · Lecture 2 — Electronics 101</footer>

<h1 id="e-33-v-vs-5-v-logic--b5">(e) 3.3 V vs 5 V logic — B5</h1>
<ul>
<li>ESP32-S3 outputs 0 / 3.3 V and must <strong>never</strong> see 5 V on a pin.</li>
<li>Lab equipment speaks <strong>5 V TTL</strong>: high ≥ 2 V, outputs up to 5 V.</li>
<li><strong>74AHCT541</strong>: 3.3 V in → 5 V out, eight lines (6 DIO + 2 fast).</li>
<li><strong>74LVC1T45</strong>: translates either way under a direction pin → the <strong>TRIG</strong> SMA is input <em>or</em> output. 100 Ω in series: two drivers on one wire survive.</li>
<li>TTL into 50 Ω ≈ 2.5 V; into 1 MΩ ≈ 5 V — the note on the panel.</li>
</ul>
<footer>Basic Skills for Experimentalists · TIGP 2026 · Lecture 2 — Electronics 101</footer>

<h1 id="f-the-buses-that-tie-it-together--base">(f) The buses that tie it together — base</h1>
<div class="two">
<div>
<p><strong>SPI</strong> — three shared wires (SCLK 12, MOSI 11, MISO 13) + one chip-select per device: ADC <code>/CS</code> 10, DAC <code>/SYNC</code> 5. 33 Ω series on the data lines; short, one direction from the socket.</p>
</div>
<div>
<p><strong>I²C</strong> — two wires (SDA 1, SCL 2), 4.7 kΩ pull-ups, addresses: OLED 0x3C, two Qwiic connectors for anything else.</p>
<p>Every block's driver is &quot;write a few bytes on one of these, read a few back&quot;.</p>
</div>
</div>
