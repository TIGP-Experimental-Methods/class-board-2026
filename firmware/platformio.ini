; PlatformIO project for the class-board instrument firmware.
;
; Three environments:
;   esp32s3      - real hardware (the class board), uploaded over USB
;   esp32s3-sim  - same code with -DSIM=1: every block fakes its hardware, so
;                  the whole app runs on a bare ESP32-S3 dev board (Workshop 1).
;   esp32s3-ota  - the esp32s3 build, uploaded over WiFi (over-the-air, OTA).
;                  The board must run firmware built with OTA_PASSWORD in
;                  include/secrets.h; secrets.ini (git-ignored, copy
;                  secrets.ini.example) holds the board's name and the same password.
;
; Flash / upload the sim build:   pio run -e esp32s3-sim -t upload
; Upload the web app (LittleFS):  pio run -e esp32s3-sim -t uploadfs
; Upload over WiFi (OTA):         pio run -e esp32s3-ota -t upload
; Web app over WiFi (OTA):        pio run -e esp32s3-ota -t uploadfs
; Serial monitor:                 pio device monitor

[platformio]
default_envs = esp32s3-sim
; Per-person OTA settings; skipped when the file does not exist.
extra_configs = secrets.ini

[ota]
; Defaults that secrets.ini overrides.
host = instrument-XXXX.local
password =

[env]
; Pinned to the 7.x platform (Arduino core 2.0.17) that this skeleton was
; verified with; bump deliberately, then re-check both envs and the libraries.
platform = espressif32 @ ^7.1.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Jinhua ESP32-S3 N16R8: 16 MB QIO flash + 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = littlefs

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB (GPIO19/20), no UART bridge needed
    -DARDUINO_USB_MODE=1          ; the chip's built-in USB-Serial/JTAG (HWCDC), not USB-OTG
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"0.1.0\"

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.12.0
    esp32async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.0
    adafruit/Adafruit NeoPixel @ ^1.15.0

; Copies host/pwa/* into firmware/data/ before every build so that
; `pio run -t uploadfs` always ships the current web app.
extra_scripts = pre:scripts/copy_pwa.py

[env:esp32s3]
; Real hardware. Nothing extra: SIM is not defined.

[env:esp32s3-sim]
build_flags =
    ${env.build_flags}
    -DSIM=1

[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = ${ota.host}
upload_flags = --auth=${ota.password}
